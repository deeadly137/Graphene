<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="arkaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be95ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Capsule shape -->
  <rect x="20" y="15" width="60" height="70" rx="30" ry="30" fill="url(#arkaGradient)" stroke="#0f62fe" stroke-width="2"/>
  <!-- Inner glow -->
  <ellipse cx="50" cy="50" rx="20" ry="25" fill="#ffffff" fill-opacity="0.2"/>
  <!-- Tech lines -->
  <line x1="35" y1="35" x2="65" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="40" y1="50" x2="60" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="35" y1="65" x2="65" y2="65" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
