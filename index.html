<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa ARKA | Graphene Corp. - Portal de Notícias</title>
    
    <!-- IBM Carbon Design System CDN -->
    <link rel="stylesheet" href="https://unpkg.com/carbon-components/css/carbon-components.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos customizados -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bx--body">
    <!-- Sidebar Navigation (Desktop Only) -->
    <nav class="arka-sidebar" id="mainSidebar">
        <div class="arka-sidebar-header">
            <!-- Logo SVG inline -->
            <svg class="arka-sidebar-logo" viewBox="0 0 100 100" style="width: 40px; height: 40px; margin-bottom: 0.5rem;">
                <rect width="100" height="100" fill="#0f62fe" rx="8"/>
                <text x="50" y="65" font-family="IBM Plex Mono, monospace" font-size="50" font-weight="700" fill="white" text-anchor="middle">G</text>
            </svg>
            <span class="arka-sidebar-brand">GRAPHENE CORP.</span>
        </div>
        <ul class="arka-sidebar-nav">
            <li class="arka-sidebar-item">
                <a href="index.html" class="arka-sidebar-link active">
                    <svg class="arka-sidebar-icon" viewBox="0 0 32 32" fill="currentColor">
                        <path d="M16 2L2 14v14h10V18h8v10h10V14L16 2zm0 3.5l10 8.5v12H20v-10h-8v10H6V14l10-8.5z"/>
                    </svg>
                    <span class="arka-sidebar-label">Início</span>
                </a>
            </li>
            <li class="arka-sidebar-item">
                <a href="news.html" class="arka-sidebar-link">
                    <svg class="arka-sidebar-icon" viewBox="0 0 32 32" fill="currentColor">
                        <path d="M28 10H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h24c1.1 0 2-.9 2-2V12c0-1.1-.9-2-2-2zm0 16H4V12h24v14zM20 6h-2V4h-4v2h-2c-1.1 0-2 .9-2 2v2h10V8c0-1.1-.9-2-2-2zm-2 4H14V8h4v2z"/>
                    </svg>
                    <span class="arka-sidebar-label">Notícias</span>
                </a>
            </li>
            <li class="arka-sidebar-item">
                <a href="#sobre" class="arka-sidebar-link">
                    <svg class="arka-sidebar-icon" viewBox="0 0 32 32" fill="currentColor">
                        <path d="M16 2a9 9 0 100 18 9 9 0 000-18zm0 16a7 7 0 110-14 7 7 0 010 14z"/>
                        <path d="M16 20c-4.4 0-8 3.6-8 8h2c0-3.3 2.7-6 6-6s6 2.7 6 6h2c0-4.4-3.6-8-8-8z"/>
                    </svg>
                    <span class="arka-sidebar-label">Sobre Nós</span>
                </a>
            </li>
        </ul>
        <!-- Login no rodapé da sidebar (Desktop) -->
        <div class="arka-sidebar-footer">
            <a href="#" id="sidebarLoginLink" class="arka-sidebar-link" style="justify-content: center;">
                <svg class="arka-sidebar-icon" viewBox="0 0 32 32" fill="currentColor">
                    <path d="M22 16l-6-6v4H8v4h8v4l6-6zM6 4h10v2H6v20h10v2H6c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                </svg>
                <span class="arka-sidebar-label">Login</span>
            </a>
        </div>
    </nav>

    <!-- Overlay para mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content Wrapper -->
    <div class="main-content-wrapper">
        <!-- Header (Mobile Only) -->
        <header class="arka-header">
            <div class="arka-brand">
                <div class="arka-logo">GRAPHENE <span>CORP.</span></div>
            </div>
            <nav class="arka-header-nav">
                <a href="index.html" class="arka-header-nav-link active">Início</a>
                <a href="news.html" class="arka-header-nav-link">Notícias</a>
                <a href="#" id="headerLoginLink" class="arka-header-nav-link">
                    <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor">
                        <path d="M22 16l-6-6v4H8v4h8v4l6-6zM6 4h10v2H6v20h10v2H6c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    </svg>
                </a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="bx--grid">

            <!-- Notícias -->
            <div class="bx--row">
                <div class="bx--col-lg-16 bx--col-md-8 bx--col-sm-4">
                    <h2 class="bx--type-expressive-heading-03" style="margin-bottom: 1rem;">Últimas Notícias</h2>
                </div>
            </div>

            <div class="bx--row">
                <div class="bx--col-lg-16 bx--col-md-8 bx--col-sm-4">
                    <div class="news-grid" id="newsGrid">
                        <!-- Notícias serão renderizadas via JS -->
                        <p style="text-align: center; color: #6f6f6f;">Carregando notícias...</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="arka-footer">
            <div class="bx--grid">
                <div class="bx--row">
                    <div class="bx--col-lg-16 bx--col-md-8 bx--col-sm-4">
                        <div class="footer-content">
                            <div class="footer-brand">
                                © 2024 Graphene Corp. | Programa ARKA
                            </div>
                            <div class="footer-slogan">
                                "A continuação para uma nova humanidade" • "Nosso objetivo é cuidar e preservar."
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/carbon-components/scripts/carbon-components.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/news.js"></script>
    <script>
        // Renderiza notícias no portal
        document.addEventListener('DOMContentLoaded', () => {
            const newsGrid = document.getElementById('newsGrid');
            if (newsGrid) {
                ARKA_NEWS.renderNewsGrid(newsGrid);
            }
            
            // Setup login links (sidebar e header)
            setupLoginLinks();
        });
        
        // Setup login links based on auth state
        function setupLoginLinks() {
            const sidebarLoginLink = document.getElementById('sidebarLoginLink');
            const headerLoginLink = document.getElementById('headerLoginLink');
            
            const handleLoginClick = (e) => {
                e.preventDefault();
                if (ARKA_AUTH.isAuthenticated()) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'login.html';
                }
            };
            
            if (sidebarLoginLink) {
                sidebarLoginLink.addEventListener('click', handleLoginClick);
            }
            
            if (headerLoginLink) {
                headerLoginLink.addEventListener('click', handleLoginClick);
            }
        }
    </script>
</body>
</html>
