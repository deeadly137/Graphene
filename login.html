<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Graphene</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Header unificado sem sidebar-drawer antiga -->
  <header class="arka-header">
    <a href="index.html" class="brand-logo">
      <img src="logo.svg" alt="Graphene Logo">
      <span>GRAPHENE</span>
    </a>
    <nav>
      <ul class="nav-menu">
        <li>
          <a href="index.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Início</span>
          </a>
        </li>
        <li>
          <a href="about.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>Sobre Nós</span>
          </a>
        </li>
        <li>
          <a href="news.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <span>Notícias</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="main-content" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card card-indigo" style="width: 100%; max-width: 420px; padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="logo.svg" alt="Graphene" style="height: 48px; margin-bottom: 1rem;">
        <h2 style="font-size: 1.5rem;">Acesso à Cápsula</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Insira suas credenciais corporativas</p>
      </div>

      <form id="loginForm">
        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">Usuário / Credencial</label>
          <input type="text" id="usernameInput" required style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">Chave de Acesso</label>
          <input type="password" id="passwordInput" required style="width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 1rem;">
        </div>

        <button type="submit" class="btn-login-nav" style="width: 100%; justify-content: center; padding: 0.85rem;">Autenticar</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Graphene Corporation. Todos os direitos reservados.</p>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
